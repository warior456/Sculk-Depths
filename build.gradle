plugins {
	id 'java'
	id 'net.neoforged.moddev' version '2.0.148'
	id 'maven-publish'
}

version = project.minecraft_version + "-" + project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url = 'https://api.modrinth.com/maven' }
}

// The original project used Loom's splitEnvironmentSourceSets(): common code lived in
// src/main, client-only code in src/client. NeoForge has a single classpath, so both
// directories are compiled into the same source set. The folder layout is unchanged.
sourceSets {
	main {
		java.srcDirs += ['src/client/java']
		resources.srcDirs += ['src/client/resources']
		// Loom's fabricApi.configureDataGeneration() added this directory to the main source set,
		// so the checked-in generated assets/models are part of the mod resources. Keep it wired up
		// or all data-generated blockstates/models disappear from the dev run and the built jar.
		resources.srcDirs += ['src/main/generated']
	}
	// The original unit tests / game tests are parked (Fabric Loader JUnit + Fabric GameTest have
	// no drop-in NeoForge equivalent); keep the files but do not compile them.
	test {
		java.srcDirs = []
		resources.srcDirs = []
	}
}

tasks.named('test') {
	enabled = false
}

neoForge {
	version = project.neoforge_version

	runs {
		client {
			client()
			gameDirectory = file('run')
		}
		server {
			server()
			gameDirectory = file('run')
		}
		data {
			data()
			gameDirectory = file('run')
			// Generates assets/data from the code-based providers (see SculkDepthsDataGenerator).
			// Matches the pre-port layout (Loom's configureDataGeneration() used src/main/generated).
			programArguments.addAll '--mod', project.archives_base_name,
					'--all',
					'--output', file('src/main/generated/').getAbsolutePath(),
					'--existing', file('src/main/resources/').getAbsolutePath()
		}
	}

	mods {
		sculk_depths {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
	options.encoding = 'UTF-8'
	// porting aid: report all errors at once instead of stopping at 100
	options.compilerArgs += ['-Xmaxerrs', '3000']
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
