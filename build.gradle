plugins {
	id 'java'
	id 'net.neoforged.moddev' version '2.0.148'
	id 'maven-publish'
}

version = project.minecraft_version + "-" + project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url = 'https://api.modrinth.com/maven' }
}

// The original project used Loom's splitEnvironmentSourceSets(): common code lived in
// src/main, client-only code in src/client. NeoForge has a single classpath, so both
// directories are compiled into the same source set. The folder layout is unchanged.
sourceSets {
	main {
		java.srcDirs += ['src/client/java']
		resources.srcDirs += ['src/client/resources']
	}
}

neoForge {
	version = project.neoforge_version

	runs {
		client {
			client()
			gameDirectory = file('run')
		}
		server {
			server()
			gameDirectory = file('run')
		}
		data {
			data()
			gameDirectory = file('run')
			// Generates assets/data from the code-based providers (see SculkDepthsDataGenerator).
			programArguments.addAll '--mod', project.archives_base_name,
					'--all',
					'--output', file('src/generated/resources/').getAbsolutePath(),
					'--existing', file('src/main/resources/').getAbsolutePath()
		}
	}

	mods {
		sculk_depths {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
	options.encoding = 'UTF-8'
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
